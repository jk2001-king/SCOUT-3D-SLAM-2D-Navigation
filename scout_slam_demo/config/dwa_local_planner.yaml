DWAPlannerROS:
  holonomic_robot: false
  max_vel_x: 0.22
  min_vel_x: 0.05
  max_vel_trans: 0.22
  min_vel_trans: 0.05
  max_vel_theta: 0.40
  min_vel_theta: 0.10
  acc_lim_x: 0.50
  acc_lim_y: 0.0
  acc_lim_theta: 0.80
  acc_lim_trans: 0.50
  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.15
  latch_xy_goal_tolerance: true
  sim_time: 1.5
  sim_granularity: 0.05
  angular_sim_granularity: 0.05
  vx_samples: 20
  vy_samples: 1
  vth_samples: 50
  path_distance_bias: 48.0
  goal_distance_bias: 12.0
  occdist_scale: 0.08
  twirling_scale: 0.20
  stop_time_buffer: 0.20
  oscillation_reset_dist: 0.20
  forward_point_distance: 0.40
  scaling_speed: 0.18
  max_scaling_factor: 0.20
  publish_traj_pc: true
  publish_cost_grid_pc: true
